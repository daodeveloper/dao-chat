services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3000"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-google}
      - EMBEDDINGS_PROVIDER=${EMBEDDINGS_PROVIDER:-openai}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - MODEL_NAME=${MODEL_NAME:-gpt-4o-mini}
      - SIGNUP_URL=${SIGNUP_URL:-https://id.daoproptech.com}
      - WATI_SHARED_SECRET=${WATI_SHARED_SECRET}
      - WEB_SEARCH_ENABLED=${WEB_SEARCH_ENABLED:-true}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - UNSTRUCTURED_API_KEY=${UNSTRUCTURED_API_KEY}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
    expose:
      - "8080"
