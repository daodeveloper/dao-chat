services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3000"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-google}
      - EMBEDDINGS_PROVIDER=${EMBEDDINGS_PROVIDER:-openai}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - SIGNUP_URL=${SIGNUP_URL:-https://id.daoproptech.com}
      - WEB_SEARCH_ENABLED=${WEB_SEARCH_ENABLED:-true}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    expose:
      - "8080"
